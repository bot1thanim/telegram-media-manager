services:
  - type: web
    name: telegram-media-manager
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # The free Render plan gates Pre-Deploy Commands. Run idempotent Alembic
    # upgrades before process startup so every deployment applies its schema.
    startCommand: alembic upgrade head && python -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      - key: GENERAL_TOPIC_THREAD_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
